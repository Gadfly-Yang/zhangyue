<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌙</title>
  <meta name="description" content="张悦，今天是我们认识的第99天。一棵心形花树慢慢长大。" />
  <meta name="theme-color" content="#fff5f7" />
  <meta property="og:title" content="张悦 · 第99天" />
  <meta property="og:description" content="一棵心形花树慢慢长大。" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <style>
    :root{
      --blush:#fff5f7;
      --rose-1:#ffd6e0;
      --rose-2:#ffc3d0;
      --peach:#ffe0cc;
      --accent:#ff6b8a;
      --accent-deep:#f43f6e;
      --crimson:#be1a25;
      --ink:#5c2230;
      --ink-soft:#a85d6e;
      --serif:"Noto Serif SC","Songti SC",serif;
      --latin:"Cormorant Garamond",serif;
      --brush:"Ma Shan Zheng","Noto Serif SC",serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-text-size-adjust:100%;}
    body{
      font-family:var(--serif);
      color:var(--ink);
      background:
        radial-gradient(1100px 620px at 88% -12%, var(--rose-1) 0%, transparent 60%),
        radial-gradient(900px 520px at -12% 112%, var(--peach) 0%, transparent 55%),
        var(--blush);
      line-height:1.8;
      overflow-x:hidden;
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:0;
      background:
        radial-gradient(ellipse at 12% 3%, #fff5cc 0%, transparent 45%),
        radial-gradient(ellipse at 74% 101%, #d7ebc7 0%, transparent 59%),
        linear-gradient(154deg,#e5f3eb 0%,#f7fae9 63%,#eff4d6 100%);
      transition:opacity .65s cubic-bezier(.25,.7,.25,1);
    }
    body.summer::before{opacity:1;}
    .season-light{position:fixed;inset:0;pointer-events:none;}
    .season-light span{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;}
    .season-light [data-light="fall"]{background:radial-gradient(ellipse at 80% 57%,#f5d39a80,transparent 63%),linear-gradient(146deg,#f4eee2,#f5e0c4);}
    .season-light [data-light="winter"]{background:radial-gradient(ellipse at 94% 37%,#f9e7cb85,transparent 54%),linear-gradient(146deg,#e1e9ef,#f3f6f5);}
    .season-light [data-light="spring"]{background:radial-gradient(ellipse at 83% 26%,#efc9bd75,transparent 55%),linear-gradient(146deg,#eff2e4,#fff3e5);}
    body[data-chapter="fall"] [data-light="fall"],
    body[data-chapter="winter"] [data-light="winter"],
    body[data-chapter="spring"] [data-light="spring"]{opacity:1;}
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--twilight,0);
      background:radial-gradient(ellipse at 11% 53%,#efb99c 0%,transparent 39%),
        linear-gradient(160deg,#a3b7d2 0%,#d4d7e7 52%,#e0e8d4 100%);
    }

    /* 无障碍 */
    .skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--accent-deep);color:#fff;padding:12px 18px;border-radius:0 0 10px 0;font-size:15px;text-decoration:none;}
    .skip:focus{left:0;}
    :focus-visible{outline:3px solid var(--accent-deep);outline-offset:3px;border-radius:8px;}

    /* 返回（角落一枚，不抢戏） */
    .back{
      position:fixed;top:16px;right:18px;z-index:10;width:44px;height:44px;
      display:flex;align-items:center;justify-content:center;border-radius:50%;
      color:var(--ink-soft);text-decoration:none;font-size:22px;
      transition:background .18s ease,color .18s ease,transform .18s ease;
    }
    .back:hover{background:rgba(255,195,208,.4);color:var(--accent-deep);transform:translateX(-2px);}
    .summer .back{color:#49614d;}
    .summer .back:hover{background:#dce9cc;color:#284e3f;}

    /* 一屏铺满：字占 30%，树占 70% */
    .scene{
      position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);
      grid-template-rows:minmax(0,1fr);
      height:100vh;height:100dvh;
      padding:clamp(16px,3vw,40px);
    }

    /* 左侧 30%：LOVE / 99 两行，占满树的左边 */
    .message{
      grid-area:1/1;
      display:flex;flex-direction:column;
      height:100%;min-height:0;
      padding:clamp(26px,6vh,64px) clamp(12px,1.6vw,26px) clamp(22px,5vh,54px) clamp(18px,3vw,52px);
    }
    .message[aria-hidden="true"]{pointer-events:none;}
    .autumn-message{transition:opacity .28s ease,transform .42s ease;}

    /* LOVE / 99 字标 */
    .lockup{
      flex:1 1 auto;min-height:0;width:100%;
      display:flex;flex-direction:column;justify-content:space-around;
    }
    .lock-line{
      display:flex;align-items:center;justify-content:flex-start;
      width:100%;min-width:0;
      filter:drop-shadow(0 14px 34px rgba(244,63,110,.16));
    }
    .love-word,.love-num{
      display:block;white-space:nowrap;
      font-family:var(--latin);line-height:.8;
      background-image:linear-gradient(103deg,#ff5d80 0%,#ef3a63 34%,#bb8fe6 67%,#e8ae62 100%);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;color:var(--accent-deep);
    }
    .love-word{font-weight:700;font-size:clamp(44px,10vw,150px);letter-spacing:.012em;}
    .love-num{font-weight:600;font-style:italic;font-size:clamp(64px,16vw,300px);letter-spacing:-.015em;}
    .summer .autumn-message{opacity:0;transform:translateY(-7px);}
    .summer .scene{grid-template-columns:minmax(0,39fr) minmax(0,61fr);}
    .summer-message{min-height:0;justify-content:center;padding:0 clamp(8px,2vw,28px);opacity:0;transform:translateY(5px);transition:opacity .45s .16s ease,transform .55s .16s ease;}
    .summer-message[aria-hidden="true"]{display:none;}
    .summer .summer-message{opacity:1;transform:none;}
    .poem{width:100%;max-width:29em;outline-offset:4px;color:#284c3b;font-size:clamp(16px,1.45vw,22px);font-weight:600;line-height:1.48;}
    .poem p + p{margin-top:.76em;}
    .poem-line{display:block;white-space:nowrap;overflow:clip;opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .8s ease,transform .8s ease;}
    .verse-ink{display:inline-block;transform-origin:left center;vertical-align:top;}
    .poem-line.visible{opacity:1;visibility:visible;transform:none;}
    .poem p:last-child .poem-line:last-child{color:#1d634e;}
    .poem h2{color:inherit;font-family:var(--brush);font-size:1.42em;font-weight:400;line-height:1.08;margin-bottom:.44em;}
    .poem[data-season="fall"]{color:#543921;}
    .poem[data-season="winter"]{color:#304654;}
    .poem[data-season="spring"]{color:#36483d;}
    .poem[data-season] .poem-line.is-current{color:var(--verse-accent,#1d634e);}
    body[data-chapter="fall"]{--verse-accent:#923d26;}
    body[data-chapter="winter"]{--verse-accent:#476e8a;}
    body[data-chapter="spring"]{--verse-accent:#a24858;}

    /* 结尾：夜色里回到心形花树 */
    .night{
      position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
      background:radial-gradient(ellipse at 62% 72%,#5c34427d,transparent 62%),
        linear-gradient(168deg,#101427 0%,#191b36 32%,#2a2244 60%,#402a41 84%,#53313f 100%);
      transition:opacity 1.8s ease;
    }
    .finale .night{opacity:1;}
    .finale-flash{
      position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;
      background:radial-gradient(circle at 64% 44%,rgba(255,248,232,.95),rgba(255,214,196,.42) 26%,rgba(255,214,196,0) 58%);
    }
    .finale .finale-flash{animation:finaleFlash 1.6s ease-out both;}
    @keyframes finaleFlash{
      0%{opacity:0;transform:scale(.92);}
      20%{opacity:.78;}
      100%{opacity:0;transform:scale(1.16);}
    }
    .finale-message{display:none;}
    .finale .finale-message{display:flex;}
    .finale .autumn-message{opacity:0;transform:translateY(-8px);}
    .finale .season-light{opacity:0;}
    .finale-lines{display:flex;flex:1 1 auto;flex-direction:column;justify-content:center;width:100%;min-height:0;}
    .finale-line{
      display:block;white-space:nowrap;
      font-family:var(--serif);font-weight:600;
      font-size:clamp(50px,7vw,124px);line-height:1.28;letter-spacing:.1em;
      color:#fff2e6;
      text-shadow:0 12px 42px rgba(255,154,176,.34),0 2px 12px rgba(16,12,34,.55);
    }
    .finale-line + .finale-line{color:#ffd8d4;margin-top:.06em;}
    .finale .finale-line{animation:finaleLineIn 1.5s cubic-bezier(.22,.8,.24,1) both;}
    .finale .finale-line:nth-child(1){animation-delay:2.05s;}
    .finale .finale-line:nth-child(2){animation-delay:2.8s;}
    @keyframes finaleLineIn{
      from{opacity:0;transform:translateY(20px);filter:blur(10px);}
      to{opacity:1;transform:none;filter:blur(0);}
    }
    .finale .back{color:#f2ddc9;}
    .finale .back:hover{background:rgba(255,226,206,.16);color:#fff3e6;}
    /* 右半：树铺满右边（JS 按右栏最大化适配，保持比例不变形） */
    .tree-wrap{grid-area:1/2;position:relative;display:flex;align-items:center;justify-content:center;height:100%;width:100%;min-height:0;}
    .stage{position:relative;}
    #canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
    .season-trigger{
      position:absolute;inset:0;border:0;background:none;font:inherit;color:#884758;pointer-events:none;
      opacity:0;transition:opacity .32s ease;
    }
    .season-trigger::before{
      content:"";position:absolute;inset:0;
      clip-path:polygon(18% 28%,23% 11%,34% 4%,43% 6%,50% 16%,57% 6%,66% 4%,77% 11%,82% 28%,80% 44%,70% 58%,58% 72%,54% 85%,53% 94%,47% 94%,48% 81%,43% 73%,30% 58%,20% 44%);
    }
    .season-trigger:not(:disabled){opacity:1;}
    .season-trigger:not(:disabled)::before{pointer-events:auto;cursor:pointer;}
    .season-trigger:focus-visible{outline:2px solid rgba(190,26,37,.45);outline-offset:-4px;border-radius:24px;}
    .summer .season-trigger{color:var(--verse-accent,#345b47);}
    .summer .season-trigger::before{
      clip-path:polygon(17% 37%,19% 25%,28% 16%,46% 10%,65% 13%,83% 25%,85% 43%,
        74% 55%,57% 64%,55% 91%,45% 94%,45% 66%,29% 59%);
    }
    .summer[data-portrait="true"] .season-trigger::before{
      clip-path:polygon(3% 43%,16% 33%,41% 31%,69% 32%,91% 42%,98% 51%,83% 57%,
        60% 64%,55% 74%,45% 75%,46% 63%,23% 59%,5% 54%);
    }

    /* 桌面：数字的斜体左边距略作光学对齐（与 LOVE 左缘齐平） */
    @media (min-width:821px){
      .love-num{margin-left:-.02em;}
    }

    /* 树的整体入场（一次，轻柔） */
    [data-enter]{opacity:0;animation:enter 1s cubic-bezier(.22,1,.36,1) forwards;}
    @keyframes enter{to{opacity:1;}}

    /* 竖屏手机被转屏提示挡住；横屏一律沿用左右分栏，避免树被压小 */
    @media (max-width:820px) and (max-aspect-ratio:1/1){
      .scene{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding-top:56px;gap:8px;}
      .message{height:auto;text-align:center;align-items:center;padding:4px 16px 0;}
      .lockup{flex:0 0 auto;height:auto;justify-content:center;gap:2px;}
      .lock-line{justify-content:center;}
      .love-word{font-size:clamp(48px,16vw,72px);}
      .love-num{font-size:clamp(64px,24vw,108px);}
      .summer .scene{
        grid-template-columns:minmax(0,64fr) minmax(0,36fr);
        grid-template-rows:minmax(0,1fr);gap:6px;
        padding:max(14px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
          max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
      }
      .summer .tree-wrap{grid-area:1/2;}
      .summer-message{height:100%;padding:0;text-align:left;}
      .poem{font-size:clamp(15px,4.1vw,20px);line-height:1.42;}
      .tree-wrap{grid-area:2/1;}
      .finale .finale-message{padding:10px 14px 0;}
      .finale-line{font-size:clamp(40px,12vw,72px);letter-spacing:.08em;}
    }
    @media (max-width:360px){
      .summer .scene{grid-template-columns:minmax(0,66fr) minmax(0,34fr);}
      .poem[data-season]{line-height:1.35;}
    }
    @media (max-width:820px) and (max-aspect-ratio:1/1){
      .summer .scene{grid-template-columns:minmax(0,69fr) minmax(0,31fr);}
    }
    @media (max-height:460px) and (min-width:540px){
      .summer .scene{grid-template-columns:minmax(0,62fr) minmax(0,38fr);padding-block:12px;}
      .poem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.4em .9em;max-width:none;line-height:1.3;}
      .poem h2{grid-area:1/1/2/3;margin-bottom:0;}
      .poem p + p{margin:0;}
      .poem p:last-child{grid-area:2/2/span 2;}
      .poem:not([data-season]) p:last-child{grid-area:1/2/span 2;}
    }
    /* 横屏手机：左边字、右边树各占半边；收紧留白，让树吃满可用高度 */
    @media (min-aspect-ratio:1/1) and (max-height:520px){
      .scene{grid-template-columns:minmax(0,38fr) minmax(0,62fr);padding:8px clamp(8px,1.4vw,16px);gap:6px;}
      .message{padding:4px 2px;}
      .summer .scene{grid-template-columns:minmax(0,48fr) minmax(0,52fr);padding:8px clamp(8px,1.4vw,16px);}
      .summer-message{padding:0 6px 0 2px;}
      .back{top:8px;right:8px;width:36px;height:36px;font-size:19px;}
      .finale .finale-message{padding:4px 6px;}
      .finale-line{font-size:clamp(34px,5vw,64px);}
    }
    /* 竖屏提示：手机上竖屏装不下这棵树，先把手机转过来 */
    .rotate-gate{
      position:fixed;inset:0;z-index:90;display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:20px;text-align:center;
      padding:32px 28px calc(32px + env(safe-area-inset-bottom));
      background:
        radial-gradient(120% 78% at 50% 0%,rgba(255,255,255,.92),rgba(255,255,255,0) 62%),
        linear-gradient(180deg,#fff6f8 0%,#fde9ef 58%,#fbe2ea 100%);
    }
    .rotate-gate .phone{
      position:relative;width:54px;height:92px;border-radius:11px;
      border:2.5px solid rgba(191,106,124,.55);
      animation:phoneTurn 3.6s cubic-bezier(.55,.02,.2,1) infinite;
    }
    .rotate-gate .phone::before{
      content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);
      width:16px;height:3px;border-radius:2px;background:rgba(191,106,124,.55);
    }
    .rotate-gate .phone::after{
      content:"";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
      width:7px;height:7px;border-radius:50%;background:rgba(191,106,124,.38);
    }
    @keyframes phoneTurn{
      0%,12%{transform:rotate(0deg) scale(1);}
      44%,74%{transform:rotate(-90deg) scale(.94);}
      100%{transform:rotate(0deg) scale(1);}
    }
    .rotate-gate .title{
      margin:0;font-family:var(--serif);font-weight:600;font-size:21px;
      letter-spacing:.16em;color:#a8576a;
    }
    .rotate-gate .hint{
      margin:0;font-family:var(--serif);font-size:12px;line-height:1.7;
      letter-spacing:.04em;color:#8a5b66;opacity:.46;
    }
    @media (max-width:820px) and (max-aspect-ratio:1/1){
      .rotate-gate{display:flex;}
      .rotate-gate .title{font-size:clamp(19px,5.4vw,23px);}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
      [data-enter]{opacity:1;}
      .message .rv{opacity:1 !important;transform:none !important;filter:none !important;}
      .finale .finale-line{animation-delay:0s !important;}
    }
  </style>
</head>
<body>
  <div class="season-light" aria-hidden="true"><span data-light="fall"></span><span data-light="winter"></span><span data-light="spring"></span></div>
  <div class="night" aria-hidden="true"></div>
  <div class="finale-flash" aria-hidden="true"></div>
  <div class="rotate-gate">
    <div class="phone" aria-hidden="true"></div>
    <p class="title">把手机横过来</p>
    <p class="hint">若手机锁了竖屏，先关掉方向锁定</p>
  </div>
  <a class="skip" href="#l1">跳到正文</a>
  <a class="back" href="index.html" aria-label="回到进入页" title="回到进入页">←</a>

  <main class="scene">
    <div class="message autumn-message" id="autumnMessage">
      <div class="lockup" id="lockup">
        <span class="lock-line"><span class="love-word rv" id="l1">LOVE</span></span>
        <span class="lock-line"><span class="love-num rv" id="days">99</span></span>
      </div>
    </div>
    <div class="message summer-message" id="summerMessage" aria-hidden="true">
      <div class="poem" id="summerPoem" tabindex="-1" aria-label="夏天的诗">
        <p>
          <span class="poem-line" aria-hidden="true">有些时刻是无法被言语捕捉的</span>
          <span class="poem-line" aria-hidden="true">比如轻踩着江风的落日</span>
          <span class="poem-line" aria-hidden="true">比如树影中恍惚的莹光</span>
          <span class="poem-line" aria-hidden="true">我生命的夏天由无数这样微不足道的时刻组成</span>
          <span class="poem-line" aria-hidden="true">可直到你的出现，它们开始欢呼雀跃</span>
          <span class="poem-line" aria-hidden="true">我也开始熠熠生辉</span>
        </p>
        <p>
          <span class="poem-line" aria-hidden="true">如果命运有嗅觉，我们的相遇该是什么气味？</span>
          <span class="poem-line" aria-hidden="true">是暖阳摩挲下氤氲的茶香</span>
          <span class="poem-line" aria-hidden="true">还是江畔风尘里裹挟的潮湿</span>
          <span class="poem-line" aria-hidden="true">尚未成形便化作无物</span>
          <span class="poem-line" aria-hidden="true">可呼吸却因此而有了形状</span>
          <span class="poem-line" aria-hidden="true">正如我的夏天开始溢彩流光</span>
        </p>
        <p>
          <span class="poem-line" aria-hidden="true">我们相识于一个微不足道的夏末</span>
          <span class="poem-line" aria-hidden="true">平凡得像余热里缓缓松动的光影</span>
          <span class="poem-line" aria-hidden="true">是你的走进让它沸腾</span>
          <span class="poem-line" aria-hidden="true">我这才发现</span>
          <span class="poem-line" aria-hidden="true">原来</span>
          <span class="poem-line" aria-hidden="true">这是我度过的唯一不平凡的夏天</span>
          <span class="poem-line" aria-hidden="true">原来</span>
          <span class="poem-line" aria-hidden="true">你就是我最盛大的夏天</span>
        </p>
      </div>
    </div>

    <div class="message finale-message" id="finaleMessage" aria-hidden="true" tabindex="-1">
      <div class="finale-lines">
        <span class="finale-line">张悦</span>
        <span class="finale-line">我爱你</span>
      </div>
    </div>

    <div class="tree-wrap" id="treeWrap" data-enter>
      <div class="stage" id="stage">
        <canvas id="canvas" width="960" height="680" role="img" aria-label="一棵开满心形花瓣的树，左边两个人依偎在一起"></canvas>
        <button type="button" class="season-trigger" id="seasonTrigger" aria-label="进入下一季" disabled></button>
      </div>
    </div>
  </main>

  <script src="season-poems.js"></script>
  <script src="season-motion.js"></script>
  <script src="letter.js"></script>
  <script>
    /* ====== 想改天数，改这里 ====== */
    var CONFIG = { days: 99 };
    document.getElementById("days").textContent = CONFIG.days;

    /* 树按右栏最大化适配（保持 960:680 比例，铺满右边又不拉伸） */
    var stage = document.getElementById("stage");
    var wrap = document.getElementById("treeWrap");
    var lockup = document.getElementById("lockup");
    var l1 = document.getElementById("l1");
    var l2 = document.getElementById("days");

    /* LOVE / 99 各按左栏宽度撑满一行，两行均分树的高度 */
    var compactQuery = window.matchMedia("(min-aspect-ratio: 1/1) and (max-height: 520px)");
    function fitLockup(){
      if (!lockup) return;
      /* 竖屏已被转屏提示挡住；横屏手机也左右分栏，所以同样按栏宽撑满 */
      var compact = compactQuery.matches;
      var roomToFill = window.matchMedia("(min-width: 821px)").matches ||
        (compact && window.innerWidth >= 480);
      if (!roomToFill){
        l1.style.fontSize = ""; l2.style.fontSize = "";
        return;
      }
      var w = lockup.clientWidth;
      var rowH = lockup.clientHeight / 2;
      if (!w || !rowH) return;
      var fill = compact ? .86 : .94;
      var h = window.innerHeight || rowH * 2;
      [[l1, .17], [l2, .42]].forEach(function(pair){
        var el = pair[0], heightCap = pair[1];
        el.style.fontSize = "100px";
        var natural = el.getBoundingClientRect().width;
        if (!natural) return;
        var size = 100 * (w * fill) / natural;
        var cap = compact ? h * heightCap : rowH / .8;
        el.style.fontSize = Math.min(size, cap) + "px";
      });
    }

    function fit(){
      var summer = document.body.classList.contains("summer");
      var finale = document.body.classList.contains("finale");
      var portrait = (summer || finale) && window.matchMedia("(max-width: 820px) and (max-aspect-ratio: 1/1)").matches;
      var aw = wrap.clientWidth, ah = wrap.clientHeight, ratio = portrait ? 430 / 890 : 960 / 680;
      var w = aw, h = w / ratio;
      if (h > ah){ h = ah; w = h * ratio; }
      stage.style.width = Math.floor(w) + "px";
      stage.style.height = Math.floor(h) + "px";
      document.body.dataset.portrait = portrait;
      if (scene) scene.setPortrait(portrait);
      fitLockup();
      if (summer) fitPoem();
    }
    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
    /* 某些手机浏览器旋转后不会及时触发 resize，这里盯住容器尺寸兜底 */
    if (window.ResizeObserver){
      var pendingFit = 0;
      new ResizeObserver(function(){
        if (pendingFit) return;
        pendingFit = requestAnimationFrame(function(){ pendingFit = 0; fit(); });
      }).observe(document.querySelector(".scene"));
    }
    if (document.fonts) document.fonts.addEventListener("loadingdone", fitLockup);

    /* LOVE 与 99 随树生长依次浮现 */
    var trigger = document.getElementById("seasonTrigger");
    var canvas = document.getElementById("canvas");
    var chapters = window.SeasonPoems;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var poem = document.getElementById("summerPoem");
    var summerMessage = document.getElementById("summerMessage");
    var poemLines = Array.from(poem.querySelectorAll(".poem-line"));
    function fitPoem() {
      // Measure the final composition, including verses that have not appeared yet.
      var inks = poemLines.map(function (line) {
        line.style.width = "";
        var ink = line.firstElementChild;
        if (!ink) {
          ink = document.createElement("span");
          ink.className = "verse-ink";
          ink.textContent = line.textContent;
          line.replaceChildren(ink);
        }
        ink.style.fontSize = "";
        ink.style.transform = "";
        return ink;
      });
      poem.style.fontSize = "";
      var height = summerMessage.clientHeight;
      if (!height) return;
      var upper = parseFloat(getComputedStyle(poem).fontSize);
      if (poem.offsetHeight > height) {
        var lower = 1;
        for (var i = 0; i < 9; i++) {
          var size = (upper + lower) / 2;
          poem.style.fontSize = size + "px";
          if (poem.offsetHeight <= height) lower = size;
          else upper = size;
        }
        poem.style.fontSize = lower + "px";
      }
      var baseSize = parseFloat(getComputedStyle(poem).fontSize);
      var art = stage.getBoundingClientRect();
      var portrait = document.body.dataset.portrait === "true";
      var back = document.querySelector(".back").getBoundingClientRect();
      var rightEdge = wrap.getBoundingClientRect().right;
      inks.forEach(function (ink) {
        var row = ink.parentElement.getBoundingClientRect();
        var space = row.width;
        if (portrait && (row.bottom < art.top - 12 || row.top > art.bottom + 24)) {
          space = (row.top <= back.bottom ? Math.min(rightEdge, back.left - 4) : rightEdge) - row.left;
        }
        ink.parentElement.style.width = space + "px";
        var natural = ink.getBoundingClientRect().width;
        if (natural <= space) return;
        var ratio = (space - 1) / natural;
        ink.style.fontSize = baseSize * Math.min(1, ratio / .87) + "px";
        ink.style.transform = "scaleX(" + Math.min(1, (space - 1) / ink.getBoundingClientRect().width) + ")";
      });
    }
    var lineInterval = 1.4, firstLineAt = .65, lineFade = .65;
    var poemDuration = firstLineAt + (poemLines.length - 1) * lineInterval + lineFade;
    var revealedLines = 0;
    var showing = -2;
    var currentChapter = null;
    var finished = false;
    var lastTwilight = "";
    var closingDescription = [
      "夏天的绿树随风摇动，两个人站在树旁牵手",
      "秋日江面泛着金光，两个人在岸边靠近，牵着手",
      "冬日湖边映着长长的影子，两个人亲吻后依偎牵手",
      "春风吹过柳梢，两个人在桥上相拥"
    ];
    function revealPoem(elapsed, twilight) {
      var tone = twilight.toFixed(3);
      if (tone !== lastTwilight) {
        document.body.style.setProperty("--twilight", tone);
        lastTwilight = tone;
      }
      while (revealedLines < poemLines.length) {
        var at = currentChapter ? currentChapter.starts[revealedLines] : firstLineAt + revealedLines * lineInterval;
        if (!reduce && elapsed < at) break;
        if (revealedLines) poemLines[revealedLines - 1].classList.remove("is-current");
        poemLines[revealedLines].classList.add("is-current");
        poemLines[revealedLines].classList.add("visible");
        poemLines[revealedLines].removeAttribute("aria-hidden");
        revealedLines++;
      }
      if (!finished && elapsed >= (currentChapter ? currentChapter.duration : poemDuration)) {
        finished = true;
        canvas.setAttribute("aria-label", closingDescription[showing + 1]);
        trigger.disabled = false;   /* 最后一章之后仍可点：进入结尾 */
      }
    }
    function setLine(el, t){
      t = Math.max(0, Math.min(1, t));
      var e = 1 - Math.pow(1 - t, 4);            /* easeOutQuart：更柔的收尾 */
      el.style.opacity = e.toFixed(3);
      el.style.transform = "translateY(" + ((1 - e) * 18).toFixed(2) + "px)";
      el.style.filter = "blur(" + ((1 - e) * 6).toFixed(2) + "px)";  /* 一次性轻模糊→清晰，梦幻柔焦 */
    }
    function reveal(p){
      setLine(l1, (p - 0.03) / 0.20);
      setLine(l2, (p - 0.25) / 0.73);
    }
    if (!reduce){ setLine(l1, 0); setLine(l2, 0); }

    function advanceSeason(input) {
      if (trigger.disabled || trigger.hidden) return;
      if (showing >= chapters.length - 1) {
        startFinale();
        return;
      }
      showing++;
      currentChapter = chapters[showing] || null;
      finished = false;
      revealedLines = 0;
      trigger.disabled = true;
      document.body.classList.add("summer");
      document.body.dataset.chapter = currentChapter ? currentChapter.id : "summer";
      document.querySelector('meta[name="theme-color"]').content = currentChapter ? currentChapter.color : "#e5f3eb";
      document.getElementById("autumnMessage").setAttribute("aria-hidden", "true");
      summerMessage.removeAttribute("aria-hidden");
      document.querySelector(".skip").href = "#summerPoem";
      if (currentChapter) {
        var title = document.createElement("h2");
        title.textContent = currentChapter.title;
        poem.replaceChildren(title);
        poem.dataset.season = currentChapter.id;
        poem.setAttribute("aria-label", currentChapter.title + "天的诗");
        currentChapter.stanzas.forEach(function (stanza) {
          var paragraph = document.createElement("p");
          stanza.forEach(function (text) {
            var line = document.createElement("span");
            line.className = "poem-line";
            line.textContent = text;
            line.setAttribute("aria-hidden", "true");
            paragraph.append(line);
          });
          poem.append(paragraph);
        });
        poemLines = Array.from(poem.querySelectorAll(".poem-line"));
        canvas.setAttribute("aria-label", currentChapter.title + "天的树与两个人的故事");
      } else {
        canvas.setAttribute("aria-label", "夏天的绿树随风摇动，两个人站在树旁打招呼");
      }
      fit();
      if (input.detail === 0) poem.focus({ preventScroll: true });
      if (currentChapter) scene.enterChapter(currentChapter);
      else scene.enterSummer();
    }

    /* 春之后：夜色降临，回到那棵心形花树，两个人坐在左下方抬头看月亮 */
    function startFinale() {
      if (document.body.classList.contains("finale")) return;
      trigger.disabled = true;
      trigger.hidden = true;
      document.body.classList.remove("summer");
      delete document.body.dataset.chapter;
      document.body.classList.add("finale");
      document.body.style.removeProperty("--twilight");
      lastTwilight = "";
      document.querySelector('meta[name="theme-color"]').content = "#151731";
      document.getElementById("autumnMessage").setAttribute("aria-hidden", "true");
      document.getElementById("finaleMessage").removeAttribute("aria-hidden");
      document.querySelector(".skip").href = "#finaleMessage";
      canvas.setAttribute("aria-label", "夜色里，两个人坐在心形花树下，抬头看左上角的弯月");
      scene.enterFinale();
      fit();
      /* 诗行先淡出，再彻底从版面里移除 */
      window.setTimeout(function () {
        summerMessage.setAttribute("aria-hidden", "true");
      }, 820);
    }

    var scene = window.LoveLetter.start({
      onProgress: reveal,
      onSummerProgress: revealPoem,
      onChapterProgress: revealPoem,
      summerDuration: poemDuration,
      onReady: function () { trigger.disabled = false; }
    });
    if (scene) trigger.addEventListener("click", advanceSeason);
    if (document.fonts) document.fonts.addEventListener("loadingdone", function () {
      if (document.body.classList.contains("summer")) fitPoem();
    });
  </script>
</body>
</html>
